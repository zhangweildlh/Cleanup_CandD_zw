; Winapp2 样例（演示 / 测试用，非完整数据库）
; 用于验证 winapp2_expand.ps1 的解析 / 检测门控 / 展开 / ExcludeKey / 双层硬保护衔接。

[ZW Demo App Cache *]
LangSecRef=3021
DetectFile=%Temp%\zw_probe_marker.txt
FileKey1=%Temp%\zw_demo_app\*|*.tmp

[ZW Demo SafeRoot Probe *]
LangSecRef=3021
DetectFile=%Temp%\zw_probe_marker.txt
FileKey1=D:\ZW工作\zw_saferoot_probe|REMOVESELF

[ZW Demo SystemCore Probe *]
LangSecRef=3021
DetectFile=%Temp%\zw_probe_marker.txt
FileKey1=C:\Windows\Temp\zw_systemcore_probe|REMOVESELF

[ZW Demo ExcludeKey *]
LangSecRef=3021
DetectFile=%Temp%\zw_probe_marker.txt
FileKey1=%Temp%\zw_exclude_app\*|*
ExcludeKey1=FILE|%Temp%\zw_exclude_app|keep.db

[ZW Demo Installed Edge *]
LangSecRef=3029
DetectFile=%LocalAppData%\Microsoft\Edge\User Data
FileKey1=%LocalAppData%\Microsoft\Edge\User Data\*\Cache|*|REMOVESELF
